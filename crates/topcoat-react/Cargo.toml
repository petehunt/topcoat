[package]
name = "topcoat-react"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
ssr = ["dep:rquickjs", "dep:tokio"]

[dependencies]
topcoat-asset.workspace = true
topcoat-core.workspace = true
topcoat-view.workspace = true
topcoat-view-macro.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rquickjs = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt"] }

[dev-dependencies]
topcoat-asset.workspace = true
topcoat-view = { workspace = true, features = ["http"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
